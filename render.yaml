# Prepared only: creating/applying this blueprint is an operator deployment step.
services:
  - type: web
    name: dream-aquarium-api
    runtime: docker
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://littleduckgt0027.github.io
      - key: PUBLIC_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
