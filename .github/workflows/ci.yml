name: Verify game and Windows launcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm run test:pages
      - if: runner.os == 'Windows'
        run: node scripts/package-windows.js
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dream-aquarium-windows
          path: artifacts/dream-aquarium-windows.zip
