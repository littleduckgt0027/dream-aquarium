name: Verify game and Windows launcher
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: npm run test:pages
      - name: Exercise root Windows batch entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:DREAM_NO_BROWSER = '1'
          $env:DREAM_PORT = '3357'
          try {
            cmd /d /c START-GAME.bat
            if ($LASTEXITCODE -ne 0) { throw 'START-GAME.bat failed' }
            $health = Invoke-RestMethod http://127.0.0.1:3357/api/health
            if ($health.application -ne 'dream-aquarium') { throw 'Wrong server' }
            $first = Get-Content data/launcher.json | ConvertFrom-Json
            cmd /d /c START-GAME.bat
            if ($LASTEXITCODE -ne 0) { throw 'Repeated START failed' }
            $second = Get-Content data/launcher.json | ConvertFrom-Json
            if ($first.pid -ne $second.pid) { throw 'Duplicate game server' }
          } finally {
            cmd /d /c STOP-GAME.bat
            if ($LASTEXITCODE -ne 0) { throw 'STOP-GAME.bat failed' }
          }
      - if: runner.os == 'Windows'
        run: node scripts/package-windows.js
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dream-aquarium-windows
          path: artifacts/dream-aquarium-windows.zip
